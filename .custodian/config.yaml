repo_key: Custodian
src_root: src
tests_root: tests

# Custodian audits itself with its own generic C1-C8 baseline. Eating
# our own dog food: if a pattern is bad enough to flag in consumer
# repos, it should be flagged here too.

audit:
  # R1/R2 (.console reconciliation gate) are opt-in. Custodian was reconciled
  # in the pilot (log/backlog trimmed, .console scrub-clean), so it dogfoods
  # enforcement: R1 (oversized log) + R2 (private-name leak) now fail-closed here.
  reconcile_enforce: true

  # RC1's default 400 is sized for an operator workspace, where the log is
  # session-continuity notes. This repo's log is a different artifact: it records
  # detector SEMANTICS that consumers depend on, so entries run long (~30 lines
  # each, measured over the 13 currently in the file) and are load-bearing rather
  # than narrative. At 400 the two rules governing the file contradict each other —
  # the pre-commit hook requires log.md to grow on every source commit, RC1 caps
  # it — so their intersection is "prune history as a precondition for committing."
  # That is not a discipline failure; it is what the two rules jointly specify.
  # ADR 0001 measured it: #66, #67 and #69 each pruned to land, and the pruned D12
  # entry was the one that shaped C16's default-off design.
  #
  # 1000 gives ~20 entries of runway, which puts reconciliation back on the
  # SCHEDULED cadence the detector intends — its own docstring calls R1
  # "LOW/advisory — a reconciliation due signal, no judgement about what to prune."
  # The gate still fires, and `cl reconcile` still archives to the private manifest
  # per spec §3.3; only the trigger point moves off "every other commit".
  #
  # This is an interim local measure, NOT the fix. The fix is ADR 0001, which is
  # open with ContextLifecycle as spec owner. Custodian cannot change what RC1
  # means fleet-wide on its own, so it changes only its own threshold and keeps
  # the history the ADR argues is worth keeping while that decision is pending.
  r1_line_budget: 1000

  # C16 scans tests/ here too. Same dogfooding stance as reconcile_enforce:
  # the backlog is cleared, so the gate stays on. This is the blind spot that
  # let three tests write cp1252 and fail only on Windows (#67) while C16
  # reported clean — it only ever walked src_root.
  c16_scan_tests: true

  # CAP1 — enforce that the capabilities this repo owns (repo_health_audit) point
  # at invocation.ref code that resolves here (custodian-multi in [project.scripts]).
  # registry_repo locates the capability registry + manifest without enabling the
  # X-class cross_repo detectors.
  capabilities:
    enforce: true
    registry_repo: ../PlatformManifest
  # Terms used as documentation vocabulary (category labels, config key names)
  # that are not Python class/function names — suppress K1/K2 false positives.
  common_words:
    - custodian_hygiene
    - custodian_policy
    - forbidden_import_prefix
    - forbidden_import
    - max_lines
    - max_classes
    - max_functions
    - class_field_count
    - vulture_advisory
    - write_text
    - managed_repo

  known_values:
    - custodian_hygiene
    - custodian_policy

  # C1/C6: code_health.py contains "TODO" and "FIXME" as regex string literals
  # inside the detector patterns — not actual debt markers.
  # C2: audit.py is a CLI entrypoint that legitimately writes to stdout.
  # C7: test_code_health_detectors.py has `assert True` as the test fixture
  #     for C7 itself, and sample_consumer/tests/ is the test fixture repo.
  exclude_paths:
    C1:
      # code_health.py contains "TODO" as regex pattern strings — not debt markers.
      - src/custodian/audit_kit/code_health.py
      # ghost.py TODO markers are active development (detector under construction).
      # symbol_index.py TODO is a known gap tracked in backlog.
      - src/custodian/audit_kit/detectors/ghost.py
      - src/custodian/audit_kit/passes/symbol_index.py
    C6:
      # code_health.py contains "FIXME" as regex pattern strings — not debt markers.
      - src/custodian/audit_kit/code_health.py
      # ghost.py FIXME markers are active development — not stale.
      - src/custodian/audit_kit/detectors/ghost.py
    C10:
      # code_health.py mentions datetime.now() / utcnow() in the C10 detector's
      # docstring and regex — not actual naive datetime calls.
      - src/custodian/audit_kit/code_health.py
    C2:
      - src/custodian/cli/audit.py
      - src/custodian/cli/doctor.py
      - src/custodian/cli/multi.py
      - src/custodian/cli/main.py
      - src/custodian/cli/fix.py
      - src/custodian/cli/report.py
      - src/custodian/cli/config_migrate.py
    # C7 (assert True) was retired during the tool-first deprecation pass —
    # no longer a registered detector, so its exclude_paths entry is dead.
    C9:
      # CLI tools (doctor, multi) catch load/audit errors and surface them in
      # their human-readable output — the exception message IS captured;
      # no logger infrastructure is needed in CLI entry points.
      - src/custodian/cli/doctor.py
      - src/custodian/cli/multi.py
    C15:
      # code_health.py uses logger.info(f"...") as an example in the C15
      # docstring — not an actual logger call.
      - src/custodian/audit_kit/code_health.py
    C16:
      # code_health.py mentions Path.read_text() and Path.write_text() in the
      # C16 docstring — not actual pathlib calls.
      - src/custodian/audit_kit/code_health.py
    C17:
      # code_health.py contains len(x) == 0 / len(x) > 0 as regex pattern
      # strings in the C17 detector docstring — not actual comparisons.
      - src/custodian/audit_kit/code_health.py
    C18:
      # code_health.py uses f"plain text" as an example in the C18 docstring.
      - src/custodian/audit_kit/code_health.py
    C29:
      # These files are large by design — they're the core detector registries.
      # code_health.py houses all C-class detectors; dead_code.py houses all
      # D/F-class detectors. structure.py houses A1/S1-S4/H1 — all architecture
      # detectors in one coherent module. test_shape.py houses all T-class
      # detectors (T1, T2, T6, T7, T8) plus their helpers. doc_conventions.py
      # houses DC1-DC8 plus the front-matter / link-graph / ordering helpers.
      # Splitting any of these would fracture a coherent registry.
      # repograph_governance_gate.py is a single-file governance enforcement tool;
      # its checks are tightly coupled and splitting them would break cohesion.
      - src/custodian/audit_kit/code_health.py
      - src/custodian/audit_kit/detectors/dead_code.py
      - src/custodian/audit_kit/detectors/structure.py
      - src/custodian/audit_kit/detectors/test_shape.py
      - src/custodian/audit_kit/detectors/doc_conventions.py
      - src/custodian/audit_kit/detectors/docs.py
      - src/custodian/cli/repograph_governance_gate.py
    C13:
      # CLI tools set os.environ["NO_COLOR"] to disable terminal colour in
      # subprocess output — this is terminal-formatting control, not config
      # access. Custodian itself has no centralised config layer.
      - "src/custodian/**/*.py"
    P1:
      # These builder functions intentionally return [] — the module docstring
      # explains the class was removed/superseded by ruff/ty adapter rules.
      - src/custodian/audit_kit/detectors/imports.py
      - src/custodian/audit_kit/detectors/annotations.py
      - src/custodian/audit_kit/detectors/complexity.py
      # _load_codemods() is a documented scaffold: it will grow as codemods are
      # added; returning [] is not hollow but a "no codemods yet" sentinel.
      - src/custodian/cli/fix.py
    U5:
      # Builder functions return [] intentionally — classes were removed/superseded
      # and the empty list is the correct sentinel. fix.py scaffold same rationale.
      - src/custodian/audit_kit/detectors/imports.py
      - src/custodian/audit_kit/detectors/annotations.py
      - src/custodian/audit_kit/detectors/complexity.py
      - src/custodian/cli/fix.py
    T1:
      # Detector functions (detect_cN, build_*_detectors) are tested
      # transitively through the CLI and integration test suite; they're
      # invoked via the detector registry, not called directly in tests.
      - src/custodian/audit_kit/code_health.py
      - src/custodian/audit_kit/detector.py
      - src/custodian/audit_kit/detectors/dead_code.py
      - src/custodian/audit_kit/detectors/directory.py
      - src/custodian/audit_kit/detectors/ghost.py
      - src/custodian/audit_kit/detectors/structure.py
      - src/custodian/audit_kit/detectors/stubs.py
      - src/custodian/audit_kit/detectors/test_shape.py
      - src/custodian/audit_kit/detectors/docs.py
      - src/custodian/audit_kit/detectors/naming.py
      - src/custodian/audit_kit/detectors/cross_repo.py
      - src/custodian/audit_kit/detectors/architecture_split.py
      - src/custodian/audit_kit/detectors/envvar.py
      - src/custodian/audit_kit/detectors/platform_manifest_native.py
      - src/custodian/audit_kit/detectors/plumbing.py
      # policy dataclasses are used by governance gate, tested transitively.
      - src/custodian/policy/public_surface_catalog.py
      # CLI runner and report modules are tested through end-to-end CLI tests.
      - src/custodian/cli/runner.py
      - src/custodian/cli/report.py
      # CLI color helpers used by report; no direct unit tests needed.
      - src/custodian/cli/colors.py
      # Analysis passes (AST/call/import/symbol/tests) are exercised by all
      # detector tests that need graph data — not called directly in tests.
      - src/custodian/audit_kit/passes/ast_forest.py
      - src/custodian/audit_kit/passes/call_graph.py
      - src/custodian/audit_kit/passes/import_graph.py
      - src/custodian/audit_kit/passes/symbol_index.py
      - src/custodian/audit_kit/passes/tests_forest.py
      # Plugin protocols are implemented by downstream _custodian/ overlays, not tests.
      - src/custodian/plugins/protocols.py
      # SARIF report writer is an optional output format; tested through CLI integration.
      - src/custodian/reports/sarif_report.py
      # Triage matrix dataclass — tested via the joiner/render integration path.
      - src/custodian/triage/matrix.py
    T6:
      # CLI entrypoints are tested via integration suites (subprocess invocation),
      # not direct imports. Adapter & plugin modules are tested via the registry
      # path, not by name-import in tests.
      - "src/custodian/cli/**"
      - "src/custodian/adapters/**"
      - "src/custodian/plugins/**"
      - src/custodian/audit_kit/detectors/platform_manifest_native.py
      - src/custodian/reports/sarif_report.py
      - src/custodian/triage/matrix.py
      - src/custodian/triage/joiner.py
    T7:
      # Same rationale as T6: parallel test files for CLI/adapters/plugins
      # would mostly mirror integration tests already in tests/.
      - "src/custodian/cli/**"
      - "src/custodian/adapters/**"
      - "src/custodian/plugins/**"
      - "src/custodian/codemods/**"
      - "src/custodian/config/**"
      - "src/custodian/core/**"
      - "src/custodian/policy/**"
      - "src/custodian/reports/**"
      - "src/custodian/triage/**"
      - src/custodian/audit_kit/result.py
      - src/custodian/audit_kit/passes/ast_forest.py
      - src/custodian/audit_kit/passes/call_graph.py
      - src/custodian/audit_kit/passes/import_graph.py
      - src/custodian/audit_kit/passes/symbol_index.py
      - src/custodian/audit_kit/passes/tests_forest.py
      - src/custodian/audit_kit/detector.py
      - src/custodian/audit_kit/detectors/directory.py
      - src/custodian/audit_kit/detectors/imports.py
      - src/custodian/audit_kit/detectors/annotations.py
      - src/custodian/audit_kit/detectors/complexity.py
      - src/custodian/audit_kit/detectors/naming.py
      - src/custodian/audit_kit/detectors/docs.py
      - src/custodian/audit_kit/detectors/ghost.py
      - src/custodian/audit_kit/detectors/stubs.py
      - src/custodian/audit_kit/detectors/repo_meta.py
      - src/custodian/audit_kit/detectors/structure.py
      - src/custodian/audit_kit/detectors/dead_code.py
      - src/custodian/audit_kit/detectors/test_shape.py
      - src/custodian/audit_kit/detectors/readme.py
      - src/custodian/audit_kit/detectors/boundary.py
      - src/custodian/audit_kit/detectors/doc_conventions.py
      - src/custodian/audit_kit/detectors/cross_repo.py
      # CAP1 is exercised by tests/test_cap1_detector.py (flat layout); T1/T6 are
      # satisfied by direct-import tests of detect_cap1/build_capability_detectors.
      - src/custodian/audit_kit/detectors/capability_refs.py
      - src/custodian/audit_kit/detectors/architecture_split.py
      - src/custodian/audit_kit/detectors/envvar.py
      - src/custodian/audit_kit/detectors/platform_manifest_native.py
      - src/custodian/audit_kit/detectors/plumbing.py
      - src/custodian/audit_kit/detectors/workspace.py
      - src/custodian/audit_kit/code_health.py
      - src/custodian/triage/matrix.py
      - src/custodian/reports/sarif_report.py
    D11:
      # Custodian's own detectors are by-design pattern-similar within a class:
      # R3/R4 are README structural checks; M1/M2/M3 are presence-of-meta-file
      # checks; U1/U2 are stub-shape checks. Detector classes are *meant* to
      # share shape — they're a typology. Exclude detector modules from D11.
      - "src/custodian/audit_kit/detectors/**"
      - src/custodian/audit_kit/code_health.py
    D12:
      # D12 (public src symbol tested but never called in production) flags the
      # Finding helper methods (at_least, from_dict) on the live core/finding.py
      # dataclass — exercised via unit tests but not used in Custodian's own
      # internal run path. Low priority; excluded pending an opportunistic trim.
      # (The orphan core/runner.py + policy/{filter,architecture}.py modules that
      # were also excluded here were deleted as dead scaffold — 2026-06-18.)
      - src/custodian/core/finding.py
    T8:
      # Sample-consumer fixtures are deliberately minimal repos used to
      # test the audit pipeline end-to-end; they don't import custodian.
      - "tests/fixtures/sample_consumer/**"
      - tests/test_cli_doctor.py
# Tool adapters — run external tools alongside AST-based detectors.
# Results appear in audit output with source: "adapter".
tools:
  ruff: true
  vulture: true
  # mypy: true          # enable when stubs / type annotations are in place
  ty: true              # Astral's type-checker (pre-1.0; pinned in pyproject.toml)
  # semgrep: true       # requires rules/semgrep/ directory with .yaml rule files

# ---------------------------------------------------------------------------
# Privacy / boundary enforcement (Custodian B-class — self)
# ---------------------------------------------------------------------------
# Custodian dogfoods its own B1 detector. Names here cause B1 to fail
# any tracked file that mentions them, with the default excludes
# (.console/**, .custodian/config.yaml itself, docs/history/**, etc.)
# applied automatically.
privacy:
  require_boundary_artifact: true
  exclude_paths:
    # Test files that exercise B1 and boundary checks must name private-truth
    # repos as fixtures — the name IS the test case.
    - tests/test_boundary_detectors.py
    - tests/test_repograph_governance_gate.py
