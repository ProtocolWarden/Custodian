name: semantic-federation

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

jobs:
  federation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Custodian
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install ruff vulture ty

      - name: Materialize boundary artifact file
        env:
          REPOGRAPH_BOUNDARY_ARTIFACT_SOURCE: ${{ secrets.REPOGRAPH_BOUNDARY_ARTIFACT_FILE }}
        run: |
          if [ -z "${REPOGRAPH_BOUNDARY_ARTIFACT_SOURCE:-}" ]; then
            echo "Missing REPOGRAPH_BOUNDARY_ARTIFACT_FILE secret" >&2
            exit 1
          fi
          tmp_file="$(mktemp "${RUNNER_TEMP:-/tmp}/repograph-boundary-XXXXXX.json")"
          python - "$REPOGRAPH_BOUNDARY_ARTIFACT_SOURCE" "$tmp_file" <<'PY'
          import json
          import shutil
          import sys
          import urllib.request
          from pathlib import Path

          source = sys.argv[1]
          dest = Path(sys.argv[2])
          src_path = Path(source)
          if src_path.is_file():
              shutil.copyfile(src_path, dest)
          elif source.startswith(("http://", "https://")):
              with urllib.request.urlopen(source) as response, dest.open("wb") as fh:
                  shutil.copyfileobj(response, fh)
          else:
              raise SystemExit(f"Unsupported boundary artifact source: {source}")
          data = json.loads(dest.read_text(encoding="utf-8"))
          print(f"boundary_provenance={data.get('source_graph_id')}@{data.get('source_ref_or_commit')}")
          PY
          echo "REPOGRAPH_BOUNDARY_ARTIFACT_FILE=$tmp_file" >> "$GITHUB_ENV"

      - name: Clone public repos
        run: |
          workspace="${RUNNER_TEMP:-/tmp}/repograph-public-repos"
          rm -rf "$workspace"
          mkdir -p "$workspace"
          cp -R "$GITHUB_WORKSPACE" "$workspace/Custodian"
          for repo in \
            OperatorConsole \
            OperationsCenter \
            SwitchBoard \
            CxRP \
            RxP \
            CoreRunner \
            SourceRegistry \
            PlatformManifest \
            PlatformDeployment \
            Warehouse \
            ProtocolWarden.github.io \
            RepoGraph
          do
            git clone --depth 1 "https://github.com/ProtocolWarden/${repo}.git" "$workspace/$repo"
          done
          echo "WORKSPACE_ROOT=$workspace" >> "$GITHUB_ENV"

      - name: Run federated semantic gate
        run: |
          custodian-repograph-migration-gate \
            --repo-root "$WORKSPACE_ROOT" \
            --boundary-artifact "$REPOGRAPH_BOUNDARY_ARTIFACT_FILE" \
            --json-out "$RUNNER_TEMP/repograph-federation.json" \
            --summary-out "$RUNNER_TEMP/repograph-federation.md"

