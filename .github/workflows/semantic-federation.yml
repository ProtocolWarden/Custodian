name: semantic-federation

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

jobs:
  federation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Custodian
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install ruff vulture ty

      - name: Install ripgrep (the gate shells out to rg)
        run: sudo apt-get update -q && sudo apt-get install -y -q ripgrep

      - name: Materialize boundary artifact file
        # Decode the boundary disclosure artifact from the base64 CONTENT secret
        # REPOGRAPH_BOUNDARY_ARTIFACT_B64. The older *_FILE path secret pointed at a
        # source that no longer resolves on a CI runner (404). Mirrors the pattern
        # already used by custodian-audit.yml.
        env:
          REPOGRAPH_BOUNDARY_ARTIFACT_B64: ${{ secrets.REPOGRAPH_BOUNDARY_ARTIFACT_B64 }}
        run: |
          if [ -z "${REPOGRAPH_BOUNDARY_ARTIFACT_B64:-}" ]; then
            echo "Missing REPOGRAPH_BOUNDARY_ARTIFACT_B64 secret" >&2
            exit 1
          fi
          dest="$(mktemp "${RUNNER_TEMP:-/tmp}/repograph-boundary-XXXXXX.json")"
          printf '%s' "$REPOGRAPH_BOUNDARY_ARTIFACT_B64" | base64 -d > "$dest"
          python - "$dest" <<'PY'
          import json
          import sys
          from pathlib import Path

          data = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          print(f"boundary_provenance={data.get('source_graph_id')}@{data.get('source_ref_or_commit')}")
          PY
          echo "REPOGRAPH_BOUNDARY_ARTIFACT_FILE=$dest" >> "$GITHUB_ENV"

      - name: Clone public repos
        run: |
          workspace="${RUNNER_TEMP:-/tmp}/repograph-public-repos"
          rm -rf "$workspace"
          mkdir -p "$workspace"
          cp -R "$GITHUB_WORKSPACE" "$workspace/Custodian"
          for repo in \
            OperatorConsole \
            OperationsCenter \
            SwitchBoard \
            CxRP \
            RxP \
            CoreRunner \
            SourceRegistry \
            PlatformManifest \
            PlatformDeployment \
            Warehouse \
            ProtocolWarden.github.io \
            RepoGraph
          do
            git clone --depth 1 "https://github.com/ProtocolWarden/${repo}.git" "$workspace/$repo"
          done
          echo "WORKSPACE_ROOT=$workspace" >> "$GITHUB_ENV"

      - name: Run federated semantic gate
        run: |
          custodian-repograph-governance-gate \
            --repo-root "$WORKSPACE_ROOT" \
            --boundary-artifact "$REPOGRAPH_BOUNDARY_ARTIFACT_FILE" \
            --json-out "$RUNNER_TEMP/repograph-federation.json" \
            --summary-out "$RUNNER_TEMP/repograph-federation.md"

