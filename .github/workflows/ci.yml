name: CI
on: [push, pull_request]
jobs:
  license-check:
    name: License headers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check SPDX headers
        run: |
          missing=$(git ls-files "*.py" | xargs grep -L "SPDX-License-Identifier" 2>/dev/null || true)
          if [ -n "$missing" ]; then
            echo "Missing SPDX-License-Identifier header in:"
            echo "$missing"
            exit 1
          fi

  custodian:
    name: Custodian doctor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Custodian
        run: pip install -e .
      - name: Verify .custodian.yaml
        run: custodian-doctor --strict --repo .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .[dev]
      # The repograph-governance-gate tests shell out to ripgrep.
      - run: sudo apt-get update -q && sudo apt-get install -y -q ripgrep
      - run: pytest -q
      - run: ruff check src
